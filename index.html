<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Minijuegos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Hace que el Apple Watch use su ancho real en vez de simular un iPhone -->
<meta name="disabled-adaptations" content="watch">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; position: fixed;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- Lienzo ----------
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 176, H = 215, S = 1;

  function resize() {
    var iw = window.innerWidth, ih = window.innerHeight;
    var dpr = window.devicePixelRatio || 1, k = 1;
    if (iw <= 500) {            // reloj o móvil: pantalla completa
      W = iw;
      H = Math.min(ih, Math.round(iw * 1.45));
    } else {                    // ordenador: marco con tamaño de reloj, ampliado
      W = 198; H = 242;
      k = Math.max(1, Math.floor(Math.min(iw / W, ih / H)));
    }
    cv.style.width = (W * k) + 'px';
    cv.style.height = (H * k) + 'px';
    cv.width = Math.round(W * k * dpr);
    cv.height = Math.round(H * k * dpr);
    S = k * dpr;
  }
  window.addEventListener('resize', resize);
  resize();

  var WHITE = '#fff', GREY = '#777';
  function col(c) { ctx.fillStyle = c; }
  function R(x, y, w, h) {
    ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
  }
  function box(x, y, w, h, t) {
    t = t || 1;
    R(x, y, w, t); R(x, y + h - t, w, t); R(x, y, t, h); R(x + w - t, y, t, h);
  }

  // ---------- Letras hechas de cuadraditos (3x5) ----------
  var F = {
    A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110',
    E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101',
    I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
    M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100',
    Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
    U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
    Y: '101101010010010', Z: '111001010100111',
    '0': '111101101101111', '1': '010110010010111', '2': '110001010100111', '3': '110001010001110',
    '4': '101101111001001', '5': '111100110001110', '6': '011100111101111', '7': '111001010010010',
    '8': '111101111101111', '9': '111101111001110',
    '+': '000010111010000', '-': '000000111000000', '.': '000000000000010',
    '<': '001010100010001', '>': '100010001010100', '!': '010010010000010',
    '/': '001001010100100', '%': '101001010100101'
  };
  // M y W necesitan 5 de ancho para no confundirse con N y H
  F.M = '1000111011101011000110001';
  F.W = '1000110001101011101110001';
  function gw(ch) { var g = F[ch]; return g ? g.length / 5 : 3; }
  function tw(s, p) {
    s = String(s);
    var n = 0;
    for (var i = 0; i < s.length; i++) n += gw(s.charAt(i)) + 1;
    return (n - 1) * p;
  }
  // al: 0 centrado, -1 izquierda, 1 derecha
  function T(s, x, y, p, al) {
    s = String(s);
    var w = tw(s, p);
    var x0 = Math.round(al === 1 ? x - w : al === -1 ? x : x - w / 2);
    y = Math.round(y);
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i), g = F[ch], n = gw(ch);
      if (g)
        for (var r = 0; r < 5; r++)
          for (var c = 0; c < n; c++)
            if (g.charAt(r * n + c) === '1') ctx.fillRect(x0 + c * p, y + r * p, p, p);
      x0 += (n + 1) * p;
    }
  }
  function P() { return Math.max(2, Math.floor(W / 44)); }

  // ---------- Guardado ----------
  var mem = {};
  var store = {
    get: function (k, d) {
      if (k in mem) return mem[k];
      try {
        var v = localStorage.getItem('mj_' + k);
        if (v != null) { mem[k] = JSON.parse(v); return mem[k]; }
      } catch (e) {}
      return d;
    },
    set: function (k, v) {
      mem[k] = v;
      try { localStorage.setItem('mj_' + k, JSON.stringify(v)); } catch (e) {}
    }
  };

  // ---------- Copia sin conexion ----------
  var offlineReady = false;
  if ('serviceWorker' in navigator) {
    try {
      navigator.serviceWorker.register('sw.js')
        .then(function () { return navigator.serviceWorker.ready; })
        .then(function () { offlineReady = true; })
        .catch(function () {});
    } catch (e) {}
  }

  function fmt(n) {
    n = Math.floor(n);
    if (n < 1000) return '' + n;
    var u = ['K', 'M', 'B', 'T', 'Q'], i = -1;
    while (n >= 1000) { n /= 1000; i++; }
    return (n < 100 ? n.toFixed(1) : '' + Math.floor(n)) + (i < u.length ? u[i] : 'E' + (i + 1) * 3);
  }

  // ---------- Pantalla de fin de partida (común) ----------
  function drawOver(score, best, isNew) {
    var p = P();
    ctx.fillStyle = 'rgba(0,0,0,0.86)';
    ctx.fillRect(0, 0, W, H);
    col(GREY);  T(isNew ? 'RECORD!' : 'FIN', W / 2, H * 0.08, p);
    col(WHITE); T(score, W / 2, H * 0.22, p + 2);
    col(GREY);  T('MEJOR ' + best, W / 2, H * 0.44, Math.max(2, p - 1));
    col(WHITE);
    var bx = W * 0.14, bw = W * 0.72;
    box(bx, H * 0.56, bw, H * 0.16, 2);
    T('OTRA', W / 2, H * 0.64 - 2.5 * p, p);
    col(GREY);
    box(bx, H * 0.77, bw, H * 0.15, 1);
    T('MENU', W / 2, H * 0.845 - 2.5 * (p - 1), Math.max(2, p - 1));
  }
  function overTap(y, retry) {
    if (y > H * 0.745) go(menu); else retry();
  }

  // =====================================================
  // MENU
  // =====================================================
  var menu = {
    enter: function () {},
    update: function () {},
    layout: function () {
      var top = H * 0.13;
      return { top: top, rowH: (H * 0.84) / 4 };
    },
    draw: function () {
      var l = this.layout(), p = P(), pn = Math.max(2, p - 1);
      col(GREY); T(offlineReady ? 'OFFLINE OK' : 'MINIJUEGOS', W / 2, H * 0.04, 2);
      var ms = store.get('torre', null);
      var items = [
        ['ESCALERA', 'MEJOR ' + store.get('bestTorre', 0)],
        ['TALA', 'MEJOR ' + store.get('bestTala', 0)],
        ['SALTO', 'MEJOR ' + store.get('bestRun', 0)],
        ['TORRETA', 'OLA ' + (ms ? ms.wave : 1)]
      ];
      for (var i = 0; i < 4; i++) {
        var y = l.top + i * l.rowH, h = l.rowH - 5;
        col(WHITE);
        box(W * 0.07, y, W * 0.86, h, 1);
        T(items[i][0], W / 2, y + h * 0.5 - 5 * pn - 1, pn);
        col(GREY);
        T(items[i][1], W / 2, y + h * 0.5 + 4, 2);
      }
    },
    tap: function (x, y) {
      var l = this.layout();
      if (y < l.top) return;
      var i = Math.min(3, Math.floor((y - l.top) / l.rowH));
      go([stairs, tala, run, torre][i]);
    }
  };

  // =====================================================
  // ESCALERA: escalera de caracol. Sube o baja para que no te caigan los escombros.
  // La torre gira contigo: tu cuadrado siempre esta delante, en el centro.
  // =====================================================
  var NS = 12; // peldaños por vuelta
  var stairs = {
    enter: function () {
      this.pos = 0; this.cam = 0; this.score = 0; this.t = 0;
      this.deb = []; this.next = 1.2; this.hop = 0;
      this.dead = false; this.deadT = 0; this.isNew = false;
    },
    hs: function () { return Math.max(5, Math.round(H * 0.03)); },
    tap: function (x, y) { this.move(x < W / 2 ? -1 : 1, y); },
    move: function (d, y) {
      if (this.dead) {
        if (this.deadT < 0.45) return;
        var self = this;
        overTap(y == null ? 0 : y, function () { self.enter(); });
        return;
      }
      this.pos += d; this.hop = 1;
      this.check();
    },
    die: function () {
      this.dead = true; this.deadT = 0;
      var b = store.get('bestTorre', 0);
      if (this.score > b) { store.set('bestTorre', this.score); this.isNew = true; }
    },
    spawn: function () {
      var maxK = this.score > 25 ? 3 : this.score > 8 ? 2 : 1;
      var k = 1 + Math.floor(Math.random() * maxK);
      var off = Math.random() < 0.5 ? 0 : Math.floor(Math.random() * 5) - 2;
      var a = this.pos + off - Math.floor(Math.random() * k);
      this.deb.push({ a: a, k: k, h: this.pos + (H * 0.62) / this.hs() + 3, done: false });
    },
    covers: function (d, slot) {
      for (var j = 0; j < d.k; j++)
        if ((((d.a + j - slot) % NS) + NS) % NS === 0) return true;
      return false;
    },
    check: function () {
      if (this.dead) return;
      for (var i = 0; i < this.deb.length; i++) {
        var d = this.deb[i];
        if (d.h < this.pos + 1.4 && d.h + 1.6 > this.pos + 0.2 && this.covers(d, this.pos)) {
          this.die(); return;
        }
      }
    },
    update: function (dt) {
      this.hop = Math.max(0, this.hop - dt * 9);
      this.cam += (this.pos - this.cam) * Math.min(1, dt * 14);
      if (this.dead) { this.deadT += dt; return; }
      this.t += dt;
      var speed = Math.min(26, 11 + this.score * 0.25);
      this.next -= dt;
      if (this.next <= 0) {
        this.spawn();
        this.next = Math.max(0.42, 1.15 - this.score * 0.012);
      }
      for (var i = this.deb.length - 1; i >= 0; i--) {
        var d = this.deb[i];
        d.h -= speed * dt;
        if (!d.done && d.h + 1.6 < this.pos - 0.5) { d.done = true; this.score++; }
        if (d.h < this.pos - 22) this.deb.splice(i, 1);
      }
      this.check();
    },
    drawDebris: function (front, cx, Rx, py, hs, da) {
      var bs = Math.round(hs * 1.6);
      for (var i = 0; i < this.deb.length; i++) {
        var d = this.deb[i];
        for (var j = 0; j < d.k; j++) {
          var th = (d.a + j - this.cam) * da;
          if ((Math.cos(th) >= 0) !== front) continue;
          var x = cx + Rx * Math.sin(th), yb = py - (d.h - this.cam) * hs;
          if (front) R(x - bs / 2, yb - bs, bs, bs);
          else R(x - bs / 4, yb - bs * 0.75, bs / 2, bs / 2);
        }
      }
    },
    draw: function () {
      var hs = this.hs(), cx = W / 2, Rx = W * 0.3, py = Math.round(H * 0.62);
      var cam = this.cam, da = 2 * Math.PI / NS, p = P();
      var s0 = Math.floor(cam - (H - py) / hs - 2), s1 = Math.ceil(cam + py / hs + 2);
      var s, th, cz, x, y, w;

      // parte de atras
      col('#555');
      for (s = s0; s <= s1; s++) {
        th = (s - cam) * da; cz = Math.cos(th);
        if (cz >= 0) continue;
        w = W * 0.06;
        R(cx + Rx * Math.sin(th) - w / 2, py - (s - cam) * hs, w, 2);
      }
      this.drawDebris(false, cx, Rx, py, hs, da);

      // columna central
      var pw = Math.round(Rx * 0.5);
      col('#000'); R(cx - pw / 2, 0, pw, H);
      col('#555'); R(cx - pw / 2, 0, 1, H); R(cx + pw / 2, 0, 1, H);

      // parte de delante
      col(WHITE);
      for (s = s0; s <= s1; s++) {
        th = (s - cam) * da; cz = Math.cos(th);
        if (cz < 0) continue;
        w = W * (0.07 + 0.06 * cz);
        R(cx + Rx * Math.sin(th) - w / 2, py - (s - cam) * hs, w, 3);
      }
      this.drawDebris(true, cx, Rx, py, hs, da);

      // jugador (hueco por dentro para distinguirlo de los escombros)
      var ps = Math.round(hs * 1.9);
      if (!(this.dead && Math.floor(this.deadT * 10) % 2 && this.deadT < 0.45)) {
        var pyy = py - ps - this.hop * 3;
        col('#000'); R(cx - ps / 2 - 1, pyy - 1, ps + 2, ps + 1);
        col(WHITE); box(cx - ps / 2, pyy, ps, ps, 3);
      }

      // marcador
      var sw = tw(this.score, p);
      col('#000'); R(cx - sw / 2 - 3, H * 0.05 - 3, sw + 6, 5 * p + 6);
      col(WHITE); T(this.score, cx, H * 0.05, p);

      if (this.t < 5 && !this.dead) {
        col(GREY);
        T('BAJA', W * 0.2, H * 0.9, 2);
        T('SUBE', W * 0.8, H * 0.9, 2);
      }
      if (this.dead && this.deadT > 0.45) drawOver(this.score, store.get('bestTorre', 0), this.isNew);
    }
  };

  // =====================================================
  // TALA: el cuadrado tala solo. Toca izquierda o derecha para cambiar de lado
  // antes de que te baje una rama encima.
  // =====================================================
  var tala = {
    enter: function () {
      this.segs = [0, 0, 0]; this.side = -1; this.score = 0;
      this.cd = 1.3; this.iv = 1.3; this.drop = 0; this.swing = 0; this.chips = [];
      this.dead = false; this.deadT = 0; this.isNew = false;
      this.gen();
    },
    gen: function () {
      while (this.segs.length < 12) {
        var last = this.segs[this.segs.length - 1];
        this.segs.push(last !== 0 ? 0 : (Math.random() < 0.25 ? 0 : (Math.random() < 0.5 ? -1 : 1)));
      }
    },
    interval: function () { return Math.max(0.2, 0.6 - this.score * 0.004); },
    die: function () {
      this.dead = true; this.deadT = 0;
      var b = store.get('bestTala', 0);
      if (this.score > b) { store.set('bestTala', this.score); this.isNew = true; }
    },
    tap: function (x, y) {
      if (this.dead) {
        if (this.deadT < 0.45) return;
        var self = this;
        overTap(y, function () { self.enter(); });
        return;
      }
      this.setSide(x < W / 2 ? -1 : 1);
    },
    setSide: function (s) {
      if (this.dead) return;
      this.side = s;
      if (this.segs[0] === s) this.die();
    },
    chop: function () {
      var b = this.segs.shift();
      this.chips.push({ x: 0, y: 0, vx: -this.side * W * 1.3, vy: -H * 0.6, b: b });
      this.score++; this.gen();
      this.drop = 1; this.swing = 1;
      this.iv = this.cd = this.interval();
      if (this.segs[0] === this.side) this.die();
    },
    update: function (dt) {
      this.drop = Math.max(0, this.drop - dt * 10);
      this.swing = Math.max(0, this.swing - dt * 8);
      for (var i = this.chips.length - 1; i >= 0; i--) {
        var c = this.chips[i];
        c.vy += H * 3.5 * dt; c.x += c.vx * dt; c.y += c.vy * dt;
        if (c.y > H || Math.abs(c.x) > W) this.chips.splice(i, 1);
      }
      if (this.dead) { this.deadT += dt; return; }
      this.cd -= dt;
      if (this.cd <= 0) this.chop();
    },
    drawSeg: function (x, y, b, sh, twd) {
      R(x, y, twd, sh - 1);
      if (b) {
        var bw = W * 0.2, bh = Math.max(3, Math.round(sh * 0.34));
        R(b < 0 ? x - bw : x + twd, y + (sh - bh) / 2, bw, bh);
      }
    },
    draw: function () {
      var cx = W / 2, p = P();
      var sh = Math.round(H * 0.105), twd = Math.round(W * 0.2), gy = Math.round(H * 0.84);
      var off = this.drop * sh, tx = Math.round(cx - twd / 2), i;
      col(WHITE);
      R(0, gy, W, 2);
      for (i = 0; i < this.segs.length; i++) {
        var y = gy - (i + 1) * sh - off;
        if (y + sh < 0) break;
        this.drawSeg(tx, y, this.segs[i], sh, twd);
      }
      for (i = 0; i < this.chips.length; i++) {
        var c = this.chips[i];
        this.drawSeg(tx + c.x, gy - sh + c.y, c.b, sh, twd);
      }
      // leñador
      var ps = Math.round(sh * 0.7);
      var px = this.side < 0 ? tx - 5 - ps : tx + twd + 5;
      if (!(this.dead && Math.floor(this.deadT * 10) % 2 && this.deadT < 0.45)) R(px, gy - ps, ps, ps);
      if (this.swing > 0) R(this.side < 0 ? px + ps : tx + twd, gy - ps * 0.65, 5, 3);

      // ritmo del siguiente hachazo
      col(GREY);
      if (!this.dead) R(W * 0.2, gy + 7, W * 0.6 * Math.max(0, 1 - this.cd / this.iv), 3);

      // marcador
      var sw = tw(this.score, p);
      col('#000'); R(cx - sw / 2 - 4, H * 0.05 - 4, sw + 8, 5 * p + 8);
      col(WHITE); T(this.score, cx, H * 0.05, p);

      if (this.score < 3 && !this.dead) {
        col(GREY);
        T('<', W * 0.1, gy + 6, 2);
        T('>', W * 0.9, gy + 6, 2);
      }
      if (this.dead && this.deadT > 0.45) drawOver(this.score, store.get('bestTala', 0), this.isNew);
    }
  };

  // =====================================================
  // SALTO: un toque para saltar. Los bloques que vuelan se pasan por debajo.
  // =====================================================
  var run = {
    enter: function () {
      this.y = 0; this.vy = 0; this.buf = 0;
      this.obs = []; this.dist = 0; this.speed = 9.5; this.next = 13;
      this.dead = false; this.deadT = 0; this.t = 0; this.isNew = false;
    },
    score: function () { return Math.floor(this.dist / 3); },
    tap: function (x, y) {
      if (this.dead) {
        if (this.deadT < 0.45) return;
        var self = this;
        overTap(y, function () { self.enter(); });
        return;
      }
      this.buf = 0.12;
    },
    update: function (dt) {
      if (this.dead) { this.deadT += dt; return; }
      this.t += dt;
      this.speed = Math.min(22, 9.5 + this.dist * 0.012);
      this.dist += this.speed * dt;

      this.buf -= dt;
      if (this.buf > 0 && this.y === 0) { this.vy = 23.3; this.buf = 0; }
      if (this.y > 0 || this.vy > 0) {
        this.vy -= 84.6 * dt;
        this.y += this.vy * dt;
        if (this.y <= 0) { this.y = 0; this.vy = 0; }
      }

      this.next -= this.speed * dt;
      if (this.next <= 0) {
        var o, r = Math.random();
        if (this.score() > 60 && r < 0.2) o = { w: 1.6, h: 0.9, alt: 1.4 };
        else if (r < 0.5) o = { w: 1, h: 1, alt: 0 };
        else if (r < 0.75) o = { w: 1, h: 2, alt: 0 };
        else o = { w: 2, h: 1, alt: 0 };
        o.x = 15;
        this.obs.push(o);
        this.next = this.speed * (0.72 + Math.random() * 0.75) + o.w;
      }
      var px0 = 2.62, px1 = 3.38, py0 = this.y + 0.1, py1 = this.y + 0.9;
      for (var i = this.obs.length - 1; i >= 0; i--) {
        var ob = this.obs[i];
        ob.x -= this.speed * dt;
        if (ob.x + ob.w < -1) { this.obs.splice(i, 1); continue; }
        if (px1 > ob.x && px0 < ob.x + ob.w && py1 > ob.alt && py0 < ob.alt + ob.h) {
          this.dead = true; this.deadT = 0;
          var b = store.get('bestRun', 0);
          if (this.score() > b) { store.set('bestRun', this.score()); this.isNew = true; }
        }
      }
    },
    draw: function () {
      var u = W / 14, gy = Math.round(H * 0.72);
      col(WHITE);
      R(0, gy, W, 2);
      for (var i = 0; i < 6; i++) {
        var sx = (((i * 3.7 - this.dist) % 16) + 16) % 16 * u - u;
        R(sx, gy + 6 + (i % 3) * 5, 2, 2);
      }
      for (var j = 0; j < this.obs.length; j++) {
        var o = this.obs[j];
        R(o.x * u, gy - (o.alt + o.h) * u, o.w * u, o.h * u);
      }
      if (!(this.dead && Math.floor(this.deadT * 10) % 2 && this.deadT < 0.45))
        R(2.5 * u, gy - (this.y + 1) * u, u, u);
      T(this.score(), W / 2, H * 0.07, P());
      if (this.t < 2 && !this.dead) { col(GREY); T('TOCA', W / 2, H * 0.86, 2); }
      if (this.dead && this.deadT > 0.45) drawOver(this.score(), store.get('bestRun', 0), this.isNew);
    }
  };

  // =====================================================
  // TORRETA: idle infinito. Dispara sola; los enemigos llegan de todas partes.
  // Las oleadas y las ofertas de la tienda se generan proceduralmente.
  // =====================================================
  var WNAME = ['BALA', 'ONDA', 'ORBE', 'RAYO'];
  var WBASE = [
    { dmg: 6, rate: 2, x: 1 },      // bala: x = enemigos que atraviesa
    { dmg: 5, rate: 0.4, x: 28 },   // onda: x = radio
    { dmg: 30, rate: 1, x: 2 },     // orbe: x = numero de orbes
    { dmg: 40, rate: 0.35, x: 0 }   // rayo
  ];
  var RATECAP = [12, 3, 1e9, 4];    // por encima, la cadencia extra se convierte en daño
  var ETYPES = [
    { s: 1, h: 1, z: 4, c: 1 },         // normal
    { s: 1.9, h: 0.45, z: 3, c: 1.2 },  // rapido
    { s: 0.55, h: 3.2, z: 6, c: 0.6 },  // tanque
    { s: 1.2, h: 0.3, z: 2, c: 2.2 }    // enjambre
  ];
  var GLOB = [['VIDA', 20], ['REGEN', 30], ['ORO', 10]];
  function seeded(n) {
    var h = ((n + 7) * 2654435761) >>> 0;
    return function () {
      h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0;
      return h / 4294967296;
    };
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  var torre = {
    enter: function () { this.shop = false; this.msg = ''; this.msgT = 0; this.saveT = 0; this.load(); },
    fresh: function () {
      return { g: 0, wave: 1, maxHp: 100, regen: 1, gm: 1, ws: [{ t: 0, dmg: 6, rate: 2, x: 1 }],
               offers: [], buys: 0, inc: 0, t: Date.now() };
    },
    geom: function () {
      this.k = W / 110; this.cx = W / 2; this.cy = H * 0.47;
      this.R = Math.hypot(W / 2, H * 0.47) / this.k + 4;
    },
    load: function () {
      var s = store.get('torre', null) || this.fresh();
      this.s = s;
      var el = Math.min(8 * 3600, Math.max(0, (Date.now() - s.t) / 1000));
      if (el > 5 && s.inc > 0) {
        var g = s.inc * el * 0.5;
        s.g += g;
        if (g >= 1) { this.msg = '+' + fmt(g); this.msgT = 3; }
      }
      while (s.offers.length < 3) s.offers.push(this.makeOffer());
      this.hp = s.maxHp; this.cd = []; this.orbA = 0; this.aim = 0;
      this.earn = 0; this.earnT = 0; this.eid = 0;
      this.geom(); this.startWave(true);
      this.save();
    },
    save: function () { this.s.t = Date.now(); store.set('torre', this.s); },

    // ----- tienda procedural -----
    baseCost: function () { return 15 * Math.pow(1.12, this.s.buys); },
    cost: function (o) { return Math.floor(this.baseCost() * o.cm); },
    rerollCost: function () { return Math.floor(this.baseCost() * 0.25); },
    makeOffer: function () {
      var s = this.s, r = Math.random();
      var rar = r < 0.06 ? 2 : r < 0.3 ? 1 : 0, mag = [1, 2, 4][rar], cm = [1, 1.7, 2.8][rar];
      var o = { rar: rar, cm: cm };
      var missing = [0, 1, 2, 3].filter(function (t) {
        return !s.ws.some(function (w) { return w.t === t; });
      });
      var k = Math.random();
      if (missing.length && k < 0.22) {
        o.kind = 'new'; o.t = pick(missing); o.mag = mag; o.cm = 3 * cm;
        o.l1 = 'ARMA NUEVA'; o.l2 = WNAME[o.t] + (rar ? ' X' + mag : '');
      } else if (k < 0.45) {
        var gi = Math.floor(Math.random() * GLOB.length);
        o.kind = 'glob'; o.st = gi; o.pct = GLOB[gi][1] * mag;
        o.l1 = 'TORRETA'; o.l2 = GLOB[gi][0] + ' +' + o.pct + '%';
      } else {
        var wi = Math.floor(Math.random() * s.ws.length), w = s.ws[wi];
        var opts = [['PODER', 'dmg', 40], ['RITMO', 'rate', 25]];
        if (w.t === 0) opts.push(['PERFORA', 'n', 0]);
        if (w.t === 1 && w.x < 70) opts.push(['RADIO', 'rad', 10]);
        if (w.t === 2 && w.x < 8) opts.push(['ORBES', 'n', 0]);
        var op = pick(opts);
        o.kind = 'up'; o.wi = wi; o.stat = op[1]; o.l1 = WNAME[w.t];
        if (op[1] === 'n') { o.rar = 1; o.cm = 2.2; o.l2 = op[0] + ' +1'; }
        else { o.pct = op[2] * mag; o.l2 = op[0] + ' +' + o.pct + '%'; }
      }
      return o;
    },
    buy: function (i) {
      var s = this.s, o = s.offers[i], c = this.cost(o);
      if (s.g < c) return;
      s.g -= c;
      if (o.kind === 'new') {
        var b = WBASE[o.t];
        s.ws.push({ t: o.t, dmg: b.dmg * o.mag * Math.pow(1.06, s.buys), rate: b.rate, x: b.x });
      } else if (o.kind === 'glob') {
        var m = 1 + o.pct / 100;
        if (o.st === 0) { s.maxHp *= m; this.hp = s.maxHp; }
        else if (o.st === 1) s.regen *= m;
        else s.gm *= m;
      } else {
        var w = s.ws[o.wi];
        if (o.stat === 'dmg') w.dmg *= 1 + o.pct / 100;
        else if (o.stat === 'rate') w.rate *= 1 + o.pct / 100;
        else if (o.stat === 'rad') w.x *= 1 + o.pct / 100;
        else w.x += 1;
      }
      s.buys++;
      s.offers[i] = this.makeOffer();
      // las ofertas que ya no tienen sentido se sustituyen
      for (var j = 0; j < 3; j++) {
        var q = s.offers[j], bad = false;
        if (q.kind === 'new') bad = s.ws.some(function (w2) { return w2.t === q.t; });
        if (q.kind === 'up' && q.stat === 'n' && s.ws[q.wi].t === 2 && s.ws[q.wi].x >= 8) bad = true;
        if (q.kind === 'up' && q.stat === 'rad' && s.ws[q.wi].x >= 70) bad = true;
        if (bad) s.offers[j] = this.makeOffer();
      }
      this.save();
    },
    reroll: function () {
      var s = this.s, c = this.rerollCost();
      if (s.g < c) return;
      s.g -= c;
      for (var j = 0; j < 3; j++) s.offers[j] = this.makeOffer();
      this.save();
    },

    // ----- oleadas procedurales -----
    startWave: function (quiet) {
      var n = this.s.wave, rnd = seeded(n);
      var a = ETYPES[Math.floor(rnd() * 4)], b = rnd() < 0.5 ? ETYPES[Math.floor(rnd() * 4)] : a;
      var count = Math.round((6 + Math.min(24, n * 0.5)) * (a.c + b.c) / 2);
      this.queue = [];
      if (n % 5 === 0) this.queue.push({ s: 0.4, h: 15, z: 10, boss: 1 });
      for (var i = 0; i < count; i++) this.queue.push(i % 2 ? b : a);
      this.spT = 0.6; this.spI = 10 / this.queue.length;
      this.ehp = 10 * Math.pow(1.13, n - 1);
      this.edmg = 6 * Math.pow(1.10, n - 1);
      this.egold = 2 * Math.pow(1.16, n - 1);
      this.espd = 9 + Math.min(6, n * 0.05);
      this.en = []; this.bul = []; this.fx = [];
      if (!quiet) { this.msg = 'OLA ' + n; this.msgT = 1.2; }
    },
    tap: function (x, y) {
      if (this.shop) {
        if (y >= H * 0.81) { if (x < W / 2) this.shop = false; else this.reroll(); return; }
        var i = Math.floor((y - H * 0.1) / (H * 0.235));
        if (i >= 0 && i < 3) this.buy(i);
        return;
      }
      if (y < H * 0.77) return;
      if (x < W * 0.4) { this.save(); go(menu); return; }
      this.shop = true;
    },
    update: function (dt) {
      var s = this.s, en = this.en, i, j, e, d, w;
      this.geom();
      this.msgT -= dt;
      this.saveT += dt;
      if (this.saveT > 5) { this.saveT = 0; this.save(); }
      this.hp = Math.min(s.maxHp, this.hp + s.maxHp * 0.01 * s.regen * dt);

      // aparicion: desde cualquier direccion, fuera de la pantalla
      this.spT -= dt;
      if (this.queue.length && this.spT <= 0 && en.length < 60) {
        var t = this.queue.pop(), ang = Math.random() * Math.PI * 2;
        en.push({ x: Math.cos(ang) * this.R, y: Math.sin(ang) * this.R, hp: this.ehp * t.h, z: t.z,
                  sp: this.espd * t.s, g: this.egold * t.h, d: this.edmg * t.z / 4, boss: t.boss, id: ++this.eid });
        this.spT = this.spI;
      }
      var near = null, nd = 1e9;
      for (i = 0; i < en.length; i++) {
        e = en[i]; d = Math.hypot(e.x, e.y);
        if (d < 5 + e.z / 2) { this.hp -= e.d; e.hp = 0; e.ng = 1; continue; }
        e.x -= e.x / d * e.sp * dt; e.y -= e.y / d * e.sp * dt;
        e.dist = d;
        if (d < nd && d < this.R - 4) { nd = d; near = e; }
      }

      // armas
      this.orbA += 2.5 * dt;
      for (i = 0; i < s.ws.length; i++) {
        w = s.ws[i];
        var r = Math.min(w.rate, RATECAP[w.t]), dm = w.dmg * w.rate / r;
        this.cd[i] = (this.cd[i] || 0) - dt;
        if (w.t === 0) {
          if (this.cd[i] <= 0 && near) {
            this.aim = Math.atan2(near.y, near.x);
            this.bul.push({ x: 0, y: 0, vx: Math.cos(this.aim) * 130, vy: Math.sin(this.aim) * 130, dmg: dm, p: w.x, last: 0 });
            this.cd[i] = 1 / r;
          }
        } else if (w.t === 1) {
          if (this.cd[i] <= 0 && near && nd < w.x) {
            for (j = 0; j < en.length; j++) if (en[j].dist < w.x) en[j].hp -= dm;
            this.fx.push({ k: 1, r: w.x, t: 0.3 });
            this.cd[i] = 1 / r;
          }
        } else if (w.t === 2) {
          for (var o = 0; o < w.x; o++) {
            var oa = this.orbA + o * Math.PI * 2 / w.x, ox = Math.cos(oa) * 20, oy = Math.sin(oa) * 20;
            for (j = 0; j < en.length; j++) {
              e = en[j];
              if (Math.abs(e.x - ox) < 3 + e.z / 2 && Math.abs(e.y - oy) < 3 + e.z / 2) e.hp -= dm * dt;
            }
          }
        } else if (this.cd[i] <= 0) {
          var best = null;
          for (j = 0; j < en.length; j++)
            if (en[j].hp > 0 && en[j].dist < this.R - 6 && (!best || en[j].hp > best.hp)) best = en[j];
          if (best) {
            best.hp -= dm;
            this.fx.push({ k: 2, x: best.x, y: best.y, t: 0.12 });
            this.cd[i] = 1 / r;
          }
        }
      }

      // balas
      for (i = this.bul.length - 1; i >= 0; i--) {
        var b = this.bul[i];
        b.x += b.vx * dt; b.y += b.vy * dt;
        for (j = 0; j < en.length && b.p > 0; j++) {
          e = en[j];
          if (e.hp > 0 && e.id !== b.last && Math.abs(e.x - b.x) < e.z / 2 + 2 && Math.abs(e.y - b.y) < e.z / 2 + 2) {
            e.hp -= b.dmg; b.last = e.id; b.p--;
          }
        }
        if (b.p <= 0 || Math.hypot(b.x, b.y) > this.R + 5) this.bul.splice(i, 1);
      }

      // bajas y oro
      for (i = en.length - 1; i >= 0; i--) {
        e = en[i];
        if (e.hp > 0) continue;
        if (!e.ng) { var gain = e.g * s.gm * (e.boss ? 10 / 15 * 1.5 : 1); s.g += gain; this.earn += gain; }
        en.splice(i, 1);
      }
      for (i = this.fx.length - 1; i >= 0; i--) { this.fx[i].t -= dt; if (this.fx[i].t <= 0) this.fx.splice(i, 1); }

      this.earnT += dt;
      if (this.earnT >= 10) {
        var rate = this.earn / this.earnT;
        s.inc = s.inc ? s.inc * 0.7 + rate * 0.3 : rate;
        this.earn = 0; this.earnT = 0;
      }

      if (this.hp <= 0) {            // la torreta cae: retrocede una oleada y sigue
        s.wave = Math.max(1, s.wave - 1);
        this.hp = s.maxHp;
        this.startWave(true);
        this.msg = 'CAIDA'; this.msgT = 1.2;
      } else if (!this.queue.length && !en.length) {
        s.wave++;
        this.startWave();
      }
    },
    draw: function () {
      var s = this.s, k = this.k, cx = this.cx, cy = this.cy, p = P(), i, e, z;
      col(WHITE);
      for (i = 0; i < this.en.length; i++) {
        e = this.en[i]; z = Math.max(2, e.z * k);
        if (e.boss) box(cx + e.x * k - z / 2, cy + e.y * k - z / 2, z, z, 2);
        else R(cx + e.x * k - z / 2, cy + e.y * k - z / 2, z, z);
      }
      for (i = 0; i < this.bul.length; i++) R(cx + this.bul[i].x * k - 1, cy + this.bul[i].y * k - 1, 2, 2);
      for (i = 0; i < s.ws.length; i++) {
        if (s.ws[i].t !== 2) continue;
        for (var o = 0; o < s.ws[i].x; o++) {
          var oa = this.orbA + o * Math.PI * 2 / s.ws[i].x;
          R(cx + Math.cos(oa) * 20 * k - 2, cy + Math.sin(oa) * 20 * k - 2, 4, 4);
        }
      }
      for (i = 0; i < this.fx.length; i++) {
        var f = this.fx[i], j;
        if (f.k === 1) {
          var rr = f.r * k * (1 - f.t / 0.3);
          col(GREY);
          for (j = 0; j < 20; j++) R(cx + Math.cos(j * 0.314) * rr - 1, cy + Math.sin(j * 0.314) * rr - 1, 2, 2);
        } else {
          var len = Math.hypot(f.x, f.y) * k, n = Math.max(1, Math.floor(len / 4));
          col(WHITE);
          for (j = 1; j <= n; j++) R(cx + f.x * k * j / n - 1, cy + f.y * k * j / n - 1, 3, 3);
        }
      }
      // torreta (hueca) con cañon
      var ts = Math.round(8 * k);
      col('#000'); R(cx - ts / 2, cy - ts / 2, ts, ts);
      col(WHITE); box(cx - ts / 2, cy - ts / 2, ts, ts, 2);
      R(cx + Math.cos(this.aim) * 6 * k - 2, cy + Math.sin(this.aim) * 6 * k - 2, 4, 4);

      // marcador
      var gt = fmt(s.g), gw2 = Math.max(tw(gt, p), W * 0.5) + 8;
      col('#000'); R(cx - gw2 / 2, 0, gw2, H * 0.04 + 5 * p + 22);
      col(WHITE); T(gt, cx, H * 0.04, p);
      col(GREY); T('OLA ' + s.wave, cx, H * 0.04 + 5 * p + 3, 2);
      var bw = W * 0.5, by0 = H * 0.04 + 5 * p + 16;
      col(GREY); box(cx - bw / 2, by0, bw, 4, 1);
      col(WHITE); R(cx - bw / 2, by0, Math.max(0.01, bw * Math.max(0, this.hp) / s.maxHp), 4);

      if (this.msgT > 0 && !this.shop) {
        var mw = tw(this.msg, p) + 12;
        col('#000'); R(cx - mw / 2, H * 0.62, mw, 5 * p + 12);
        col(WHITE); box(cx - mw / 2, H * 0.62, mw, 5 * p + 12, 1);
        T(this.msg, cx, H * 0.62 + 6, p);
      }

      // botones
      var by = H * 0.8, bh = H * 0.14, m = W * 0.06, self = this;
      col('#000'); R(0, by - 3, W, H - by + 3);
      col(GREY); box(m, by, W * 0.3, bh, 1);
      T('MENU', m + W * 0.15, by + bh / 2 - 5, 2);
      var can = s.offers.some(function (q) { return s.g >= self.cost(q); });
      var ux = m + W * 0.3 + 4, uw = W - m - ux;
      col(can ? WHITE : GREY);
      if (can) R(ux, by, uw, bh); else box(ux, by, uw, bh, 1);
      col(can ? '#000' : GREY);
      T('TIENDA', ux + uw / 2, by + bh / 2 - 5, 2);

      if (this.shop) this.drawShop();
    },
    drawShop: function () {
      var s = this.s, i;
      ctx.fillStyle = 'rgba(0,0,0,0.93)'; ctx.fillRect(0, 0, W, H);
      col(WHITE); T(fmt(s.g), W / 2, H * 0.03, 2);
      for (i = 0; i < 3; i++) {
        var o = s.offers[i], y = H * 0.1 + i * H * 0.235, h = H * 0.215, c = this.cost(o), can = s.g >= c;
        col(o.rar ? WHITE : GREY); box(W * 0.05, y, W * 0.9, h, o.rar === 2 ? 3 : 1);
        col(can ? WHITE : GREY);
        T(o.l1, W / 2, y + h * 0.12, 2);
        T(o.l2, W / 2, y + h * 0.12 + 13, 2);
        if (can) { var cw = tw(fmt(c), 2) + 8; R(W / 2 - cw / 2, y + h * 0.12 + 24, cw, 14); col('#000'); }
        T(fmt(c), W / 2, y + h * 0.12 + 26, 2);
      }
      var by = H * 0.83, bh = H * 0.13, m = W * 0.05, half = (W - 2 * m - 4) / 2;
      col(GREY); box(m, by, half, bh, 1);
      T('CERRAR', m + half / 2, by + bh / 2 - 5, 2);
      var rc = this.rerollCost(), can2 = s.g >= rc;
      col(can2 ? WHITE : GREY); box(m + half + 4, by, half, bh, 1);
      T('CAMBIAR', m + half + 4 + half / 2, by + bh / 2 - 11, 2);
      T(fmt(rc), m + half + 4 + half / 2, by + bh / 2 + 2, 2);
    }
  };

  // ---------- Escenas y bucle ----------
  var scene = menu;
  function go(s) { scene = s; s.enter(); }

  document.addEventListener('visibilitychange', function () {
    if (scene !== torre) return;
    if (document.hidden) torre.save(); else torre.load();
  });
  window.addEventListener('pagehide', function () { if (scene === torre) torre.save(); });

  // ---------- Entrada ----------
  function down(cx, cy) {
    var r = cv.getBoundingClientRect();
    scene.tap((cx - r.left) / r.width * W, (cy - r.top) / r.height * H);
  }
  var hasPE = !!window.PointerEvent;
  if (hasPE) {
    document.addEventListener('pointerdown', function (e) { e.preventDefault(); down(e.clientX, e.clientY); });
  } else {
    document.addEventListener('mousedown', function (e) { down(e.clientX, e.clientY); });
  }
  document.addEventListener('touchstart', function (e) {
    if (!hasPE) { var t = e.changedTouches[0]; down(t.clientX, t.clientY); }
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // teclado, para probar en el ordenador
  document.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (e.key === 'Escape') { if (scene === torre) torre.save(); go(menu); return; }
    var k = e.key;
    if (scene === stairs && k.indexOf('Arrow') === 0) {
      stairs.move(k === 'ArrowLeft' || k === 'ArrowDown' ? -1 : 1, 0);
    } else if (scene === tala && !tala.dead && (k === 'ArrowLeft' || k === 'ArrowRight' || k === ' ')) {
      tala.setSide(k === ' ' ? -tala.side : k === 'ArrowLeft' ? -1 : 1);
    } else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter') {
      if (scene !== menu) scene.tap(W / 2, H / 2);
    } else if (scene === menu && e.key >= '1' && e.key <= '4') {
      go([stairs, tala, run, torre][+e.key - 1]);
    }
  });

  var last = 0;
  function frame(t) {
    var dt = Math.min(0.1,Math.max(0, (t - last) / 1000 || 0));
    last = t;
    scene.update(dt);
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = WHITE;
    scene.draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // para pruebas
  window.__mj = { go: go, menu: menu, stairs: stairs, tala: tala, run: run, torre: torre, scene: function () { return scene; } };
})();
</script>
</body>
</html>
